<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desafio Git</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;color:#1F2937;line-height:1.5;background:#F4F6FB;padding:16px}
.jogo{max-width:760px;margin:0 auto}
header{background:#0E1E3A;color:#F4F6FB;border-radius:12px;padding:16px 20px;margin-bottom:16px}
header h1{font-size:1.6rem}
.placar{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:1.05rem;font-weight:700}
.placar span b{color:#F5B301}
.linha-aluno{margin-top:10px;font-size:1rem}
.linha-aluno b{color:#F5B301}
.barra{height:14px;background:#334155;border-radius:999px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:#F5B301;width:0;transition:width .3s}
.tela{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tela h2{font-size:1.4rem;margin-bottom:8px}
.tela p{margin:10px 0;font-size:1.1rem}
.fase{display:inline-block;background:#0E1E3A;color:#fff;border-radius:999px;padding:4px 14px;font-size:.95rem;font-weight:700;margin-bottom:12px}
.pergunta{font-size:1.25rem;font-weight:700;margin:14px 0}
button{font-family:inherit;font-size:1.1rem;cursor:pointer;border-radius:10px;border:2px solid #0E1E3A;padding:14px 18px;margin:8px 0;width:100%;background:#fff;color:#0E1E3A;font-weight:700}
button:hover{background:#EEF2F7}
button:disabled{opacity:.55;cursor:default}
.btn-principal{background:#0E1E3A;color:#fff}
.btn-principal:hover{background:#1E3A5F}
.btn-amarelo{background:#F5B301;border-color:#F5B301;color:#0E1E3A}
.btn-amarelo:hover{background:#FFC926}
.opcao{text-align:left}
.opcao.certa{background:#DCFCE7;border-color:#15803D;color:#14532D}
.opcao.errada{background:#FEE2E2;border-color:#B91C1C;color:#7F1D1D}
.sequencia{min-height:64px;border:2px dashed #9CA3AF;border-radius:10px;padding:10px;margin:12px 0}
.sequencia span{display:inline-block;background:#0E1E3A;color:#fff;border-radius:8px;padding:6px 12px;margin:4px;font-family:Consolas,monospace;font-size:1rem}
.sequencia.vazia{color:#6B7280}
.fichas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ficha{width:auto;background:#EEF2F7;border-color:#334155;font-family:Consolas,monospace;font-size:1rem;padding:8px 12px;margin:0}
.ficha:disabled{opacity:.35}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
.acoes button{width:auto;flex:1;min-width:140px}
.feedback{border-radius:10px;padding:14px 18px;margin:14px 0;font-size:1.1rem;display:none}
.feedback.ok{display:block;background:#DCFCE7;border:2px solid #15803D;color:#14532D}
.feedback.erro{display:block;background:#FEE2E2;border:2px solid #B91C1C;color:#7F1D1D}
.feedback.aviso{display:block;background:#FFFBEB;border:2px solid #F5B301;color:#713F12}
.final{text-align:center}
.final .pontos{font-size:3rem;font-weight:800;color:#0E1E3A;margin:10px 0}
.final .msg{font-size:1.5rem;font-weight:800;margin:10px 0}
.regras{font-size:1rem;color:#4B5563}
footer{text-align:center;color:#6B7280;font-size:.9rem;margin-top:16px}
code{font-family:Consolas,monospace;background:#EEF2F7;padding:2px 6px;border-radius:6px;font-size:1rem}
.seq{font-family:Consolas,monospace;background:#EEF2F7;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:1.05rem}
.campo{margin:14px 0}
.campo label{display:block;font-weight:700;margin-bottom:4px;font-size:1.1rem}
.campo input,.campo select{width:100%;font-family:inherit;font-size:1.1rem;padding:12px;border:2px solid #0E1E3A;border-radius:10px;background:#fff;color:#1F2937}
.erro{color:#B91C1C;font-size:1rem;display:none;margin:6px 0;font-weight:700}
.resultado-lista{text-align:left;max-width:480px;margin:14px auto}
.resultado-lista p{margin:8px 0}
@media(max-width:520px){
.tela{padding:18px}
.pergunta{font-size:1.15rem}
button{font-size:1.05rem}
.acoes button{width:100%}
}
</style>
</head>
<body>
<div class="jogo">
<header>
<h1>🖥️ Desafio Git</h1>
<div class="placar"><span>Pontos: <b id="pontos">0</b></span><span>Desafio <b id="atual">0</b>/10</span></div>
<div class="linha-aluno">Aluno(a): <b id="nomeAluno">—</b></div>
<div class="barra"><i id="barra"></i></div>
</header>
<main class="tela" id="tela"></main>
<footer>Feito para a aula de Git • v3</footer>
</div>
<script>
"use strict";
/* ======= CONFIG ======= */
const TOTAL_DESAFIOS = 10;
const PLANILHA_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe2v7QyAJA9cN-1P8l1x2R3t4Y5u6I7o8P9a0S1d2F3g4H5j6K7l8M9n0P/viewform";
const SCRIPT_URL = "";
const FASE1_PONTOS = 10, FASE2_PONTOS = 20, FASE3_PONTOS = 30;
/* ======= ESTADO ======= */
let pontos = 0, indice = 0, nomeAluno = "", turmaAluno = "", acertosFase1 = 0;
let ordemFase1 = [], ordemFase2 = [];
/* ======= PERGUNTAS ======= */
const FASE1_PERGUNTAS = [
{q:"O que o comando git status mostra?",opcoes:["O estado atual dos arquivos (o que mudou, o que está preparado)","O histórico de commits","A lista de branches remotos","A senha do GitHub"],certa:0},
{q:"O que o comando git log mostra?",opcoes:["O histórico de commits do repositório","Os arquivos modificados agora","O status da branch atual","Os repositórios do GitHub"],certa:0},
{q:"O que o comando git diff mostra?",opcoes:["As diferenças do que mudou e ainda não foi preparado","A lista de commits","Os arquivos ignorados pelo .gitignore","O nome da branch atual"],certa:0},
{q:"Para que serve o comando git add?",opcoes:["Preparar arquivos para o próximo commit (staging)","Criar um commit","Enviar para o GitHub","Apagar arquivos"],certa:0},
{q:"Para que serve o comando git commit?",opcoes:["Salvar as mudanças preparadas no histórico do repositório","Enviar as mudanças para o GitHub","Preparar arquivos","Criar uma nova branch"],certa:0},
{q:"Para que serve o comando git push?",opcoes:["Enviar os commits locais para o repositório remoto (GitHub)","Baixar mudanças do GitHub","Criar um commit","Listar branches"],certa:0},
{q:"Para que serve o comando git pull?",opcoes:["Baixar e integrar as mudanças do repositório remoto","Enviar commits para o GitHub","Desfazer o último commit","Criar uma tag"],certa:0},
{q:"O que é um commit no Git?",opcoes:["Um ponto salvo no histórico com as mudanças e uma mensagem","Um arquivo de configuração","Uma branch remota","Um comando de download"],certa:0},
{q:"O que o arquivo .gitignore faz?",opcoes:["Diz ao Git quais arquivos/pastas ignorar","Apaga arquivos do computador","Cria commits automáticos","Lista os colaboradores"],certa:0},
{q:"O que significa clonar um repositório (git clone)?",opcoes:["Baixar uma cópia completa do repositório para o computador","Enviar arquivos para o GitHub","Criar uma branch nova","Apagar o repositório remoto"],certa:0}
];
const DESAFIOS = [
{nome:"Aquecimento",tipo:"multipla",fase:1,
texto:"Você editou o arquivo chamada.txt, mas ainda não preparou nada. Qual comando mostra o que mudou?",
opcoes:["git status","git push","git clone","git branch"],certa:0},
{nome:"Mudança preparada",tipo:"multipla",fase:1,
texto:"Você deu git add na lista de presença. O que o git status deve mostrar agora?",
opcoes:["A mudança aparece como preparada para commit (staged)","Nada muda no git status","O arquivo some da pasta","O Git faz push sozinho"],certa:0},
{nome:"Primeiro registro",tipo:"multipla",fase:1,
texto:"Você preparou a chamada e quer registrar no histórico. Qual comando cria o commit?",
opcoes:["git commit -m \"chamada do dia\"","git push","git add .","git init"],certa:0},
{nome:"Publicando",tipo:"multipla",fase:1,
texto:"O commit está pronto no seu computador. Como ele chega ao GitHub?",
opcoes:["git push","git commit","git status","git log"],certa:0},
{nome:"Ordem do fluxo",tipo:"ordem",fase:2,
texto:"Coloque na ordem em que os comandos acontecem no fluxo básico:",
itens:["editar o arquivo","git add","git commit","git push"]},
{nome:"Histórico do projeto",tipo:"ordem",fase:2,
texto:"Ordene do mais antigo para o mais recente:",
itens:["git init","primeiro commit","vários commits","git push"]},
{nome:"Situação real 1",tipo:"multipla",fase:3,
texto:"Você commitou a chamada, mas percebeu que esqueceu um aluno. O que fazer?",
opcoes:["Editar o arquivo, git add e fazer um novo commit com a correção","Apagar a pasta .git e começar de novo","Dar git push antes de corrigir","Nada: o commit não pode ser alterado"],certa:0},
{nome:"Situação real 2",tipo:"multipla",fase:3,
texto:"Seu colega subiu a chamada dele no GitHub e você precisa dessa versão atualizada. O que fazer?",
opcoes:["git pull para baixar e integrar as mudanças","git push para enviar","git clone de novo em outra pasta","Esperar o Git atualizar sozinho"],certa:0},
{nome:"Situação real 3",tipo:"multipla",fase:3,
texto:"Você quer testar uma ideia sem bagunçar a branch principal. Qual comando cria e troca para a branch \"teste\"?",
opcoes:["git checkout -b teste","git branch (só lista)","git push teste","git init teste"],certa:0},
{nome:"Situação real 4",tipo:"multipla",fase:3,
texto:"Você fez uma mudança errada num arquivo e ainda NÃO deu git add. Como descartar essa mudança?",
opcoes:["git checkout -- arquivo (descarta mudanças não preparadas)","git push --force","Apagar o arquivo e dar git add","git commit -m \"desfaz\""],certa:0}
];
/* ======= TELA INICIAL ======= */
function telaInicial(){
const t=document.getElementById("tela");
t.innerHTML=`
<h2>📋 Antes de começar</h2>
<p>Digite seu nome e sua turma. Eles vão aparecer no final junto com sua pontuação.</p>
<div class="campo">
<label for="nome">Nome do aluno(a)</label>
<input id="nome" type="text" placeholder="Ex.: Maria Silva" autocomplete="off">
<div class="erro" id="erroNome">Digite seu nome para começar.</div>
</div>
<div class="campo">
<label for="turma">Turma</label>
<select id="turma">
<option value="">Selecione...</option>
<option>1º A</option><option>1º B</option><option>1º C</option>
<option>2º A</option><option>2º B</option><option>2º C</option>
<option>3º A</option><option>3º B</option><option>3º C</option>
</select>
<div class="erro" id="erroTurma">Selecione sua turma para começar.</div>
</div>
<div class="regras">
<p><b>Como funciona:</b> 10 desafios em 3 fases. Fase 1 (4 desafios, 10 pts cada), Fase 2 (2 desafios de ordenar, 20 pts cada), Fase 3 (4 situações reais, 30 pts cada). Máximo: 200 pontos.</p>
<p>Na Fase 1, você precisa acertar <b>pelo menos 3 de 4</b> para avançar. Nas fases 2 e 3, cada desafio tem <b>2 tentativas</b>.</p>
</div>
<button class="btn-principal" id="btnComecar">Começar o desafio</button>`;
document.getElementById("btnComecar").addEventListener("click",()=>{
const nome=document.getElementById("nome").value.trim();
const turma=document.getElementById("turma").value;
let ok=true;
if(!nome){document.getElementById("erroNome").style.display="block";ok=false;}
else{document.getElementById("erroNome").style.display="none";}
if(!turma){document.getElementById("erroTurma").style.display="block";ok=false;}
else{document.getElementById("erroTurma").style.display="none";}
if(!ok)return;
nomeAluno=nome;turmaAluno=turma;
document.getElementById("nomeAluno").textContent=nomeAluno+" ("+turmaAluno+")";
embaralharFase1();
proximoDesafio();
});
}
/* ======= FASE 1 ======= */
function embaralharFase1(){
const base=FASE1_PERGUNTAS.map((_,i)=>i);
for(let i=base.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[base[i],base[j]]=[base[j],base[i]];}
const escolhidas=base.slice(0,4);
const desafiosFase1=DESAFIOS.filter(d=>d.fase===1);
desafiosFase1.forEach((d,k)=>{
const p=FASE1_PERGUNTAS[escolhidas[k]];
d.texto=p.q;
d.opcoes=p.opcoes;
d.certa=p.certa;
});
}
function telaMultipla(d){
const t=document.getElementById("tela");
const nomesFase={1:"Fase 1 • Conceitos",2:"Fase 2 • Ordem",3:"Fase 3 • Situações reais"};
const pts={1:FASE1_PONTOS,2:FASE2_PONTOS,3:FASE3_PONTOS};
t.innerHTML=`<span class="fase">${nomesFase[d.fase]} • ${pts[d.fase]} pontos</span>
<h2>${d.nome}</h2>
<p class="pergunta">${d.texto}</p>
<div id="opcoes">${d.opcoes.map((op,i)=>`<button class="opcao" data-i="${i}">${op}</button>`).join("")}</div>
<div class="feedback" id="fb"></div>`;
let tentativas=(d.fase===1)?1:2;
let respondeu=false;
t.querySelectorAll(".opcao").forEach(btn=>{
btn.addEventListener("click",()=>{
if(respondeu)return;
const i=parseInt(btn.dataset.i,10);
if(i===d.certa){
respondeu=true;
btn.classList.add("certa");
if(d.fase===1)acertosFase1++;
pontos+=pts[d.fase];
fb("ok",`✅ Correto! +${pts[d.fase]} pontos.`);
atualizarPlacar();
setTimeout(proximoDesafio,1200);
}else{
tentativas--;
btn.classList.add("errada");
btn.disabled=true;
if(tentativas>0){
fb("aviso",`⚠️ Não foi dessa vez. Tente de novo! (${tentativas} tentativa restante)`);
}else{
respondeu=true;
const certaBtn=t.querySelector(`.opcao[data-i="${d.certa}"]`);
if(certaBtn)certaBtn.classList.add("certa");
if(d.fase===1){
fb("erro","❌ Resposta errada. Na Fase 1 não há segunda chance!");
setTimeout(proximoDesafio,1800);
}else{
fb("erro",`❌ Resposta errada. A certa era: <b>${d.opcoes[d.certa]}</b>`);
setTimeout(proximoDesafio,2200);
}
}
}
});
});
}
/* ======= FASE 2 ======= */
function telaOrdem(d){
const t=document.getElementById("tela");
const fichas=[...d.itens];
for(let i=fichas.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fichas[i],fichas[j]]=[fichas[j],fichas[i]];}
d.fichas=fichas;
let sequencia=[];
let tentativas=2;
let respondeu=false;
t.innerHTML=`<span class="fase">Fase 2 • Ordem • ${FASE2_PONTOS} pontos</span>
<h2>${d.nome}</h2>
<p class="pergunta">${d.texto}</p>
<div class="sequencia vazia" id="seq">Toque nas fichas abaixo na ordem certa...</div>
<div class="fichas" id="fichas">${fichas.map((f,i)=>`<button class="ficha" data-i="${i}">${f}</button>`).join("")}</div>
<div class="acoes">
<button class="btn-amarelo" id="btnLimpar">Limpar</button>
<button class="btn-principal" id="btnVerificar">Verificar ordem</button>
</div>
<div class="feedback" id="fb"></div>`;
const seqEl=document.getElementById("seq");
const fichasEl=document.getElementById("fichas");
function desenhar(){
if(sequencia.length===0){seqEl.textContent="Toque nas fichas abaixo na ordem certa...";seqEl.classList.add("vazia");}
else{seqEl.classList.remove("vazia");seqEl.innerHTML=sequencia.map(s=>`<span>${s}</span>`).join("");}
}
fichasEl.querySelectorAll(".ficha").forEach(f=>{
f.addEventListener("click",()=>{
if(respondeu)return;
sequencia.push(d.fichas[parseInt(f.dataset.i,10)]);
f.disabled=true;
desenhar();
});
});
document.getElementById("btnLimpar").addEventListener("click",()=>{
if(respondeu)return;
sequencia=[];
fichasEl.querySelectorAll(".ficha").forEach(f=>f.disabled=false);
desenhar();
fb("aviso","Sequência limpa. Tente de novo!");
});
document.getElementById("btnVerificar").addEventListener("click",()=>{
if(respondeu||sequencia.length===0)return;
const ok=sequencia.length===d.itens.length&&sequencia.every((v,i)=>v===d.itens[i]);
if(ok){
respondeu=true;
pontos+=FASE2_PONTOS;
fb("ok",`✅ Ordem perfeita! +${FASE2_PONTOS} pontos.`);
atualizarPlacar();
setTimeout(proximoDesafio,1400);
}else{
tentativas--;
if(tentativas>0){
fb("aviso",`⚠️ Ordem errada. Mais ${tentativas} tentativa! Dica: pense no fluxo de trabalho.`);
sequencia=[];
fichasEl.querySelectorAll(".ficha").forEach(f=>f.disabled=false);
desenhar();
}else{
respondeu=true;
fb("erro",`❌ Não foi. A ordem certa era: <b>${d.itens.join(" → ")}</b>`);
setTimeout(proximoDesafio,2600);
}
}
});
}
/* ======= FLUXO ======= */
function atualizarPlacar(){
document.getElementById("pontos").textContent=pontos;
document.getElementById("atual").textContent=Math.min(indice+1,TOTAL_DESAFIOS);
document.getElementById("barra").style.width=(indice/TOTAL_DESAFIOS*100)+"%";
}
function fb(tipo,html){
const el=document.getElementById("fb");
el.className="feedback "+tipo;
el.innerHTML=html;
}
function proximoDesafio(){
if(indice>=DESAFIOS.length){telaFinal();return;}
const d=DESAFIOS[indice];
atualizarPlacar();
if(indice===4){
const t=document.getElementById("tela");
if(acertosFase1<3){
t.innerHTML=`<h2>⚠️ Fase 1 concluída</h2>
<p>Você acertou <b>${acertosFase1} de 4</b>. Para avançar, precisa de pelo menos 3 acertos.</p>
<p>Que tal revisar os conceitos e tentar de novo?</p>
<button class="btn-principal" id="btnRecomecar">Recomeçar o desafio</button>`;
document.getElementById("btnRecomecar").addEventListener("click",()=>location.reload());
return;
}
}
if(d.tipo==="multipla")telaMultipla(d);
else if(d.tipo==="ordem")telaOrdem(d);
}
/* ======= TELA FINAL ======= */
function telaFinal(){
document.getElementById("barra").style.width="100%";
document.getElementById("atual").textContent=TOTAL_DESAFIOS;
let msg;
if(pontos>=170)msg="🏆 Excelente! Você domina o básico de Git!";
else if(pontos>=120)msg="👏 Muito bem! Continue praticando!";
else if(pontos>=60)msg="👍 Bom começo! Revise os comandos e tente de novo.";
else msg="📚 Continue estudando! O Git fica mais fácil com prática.";
const t=document.getElementById("tela");
t.innerHTML=`<div class="final">
<h2>🎉 Desafio concluído!</h2>
<div class="pontos">${pontos}</div>
<p>pontos de 200</p>
<div class="msg">${msg}</div>
<div class="resultado-lista">
<p><b>Aluno(a):</b> ${nomeAluno}</p>
<p><b>Turma:</b> ${turmaAluno}</p>
<p><b>Acertos na Fase 1:</b> ${acertosFase1} de 4</p>
</div>
<button class="btn-amarelo" id="btnPlanilha">Enviar resultado para a planilha</button>
<p class="regras">Ao clicar, um formulário será aberto para você registrar nome, turma e pontos.</p>
</div>`;
document.getElementById("btnPlanilha").addEventListener("click",()=>{
window.open(PLANILHA_URL,"_blank");
const p=document.createElement("p");
p.className="regras";
p.innerHTML="✅ <b>Formulário aberto!</b> Preencha com seus dados.<br>"+
"<b>Nome:</b> "+nomeAluno+" | <b>Turma:</b> "+turmaAluno+" | <b>Pontos:</b> "+pontos;
t.appendChild(p);
if(SCRIPT_URL){
fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
body:JSON.stringify({nome:nomeAluno,turma:turmaAluno,pontos:pontos,data:new Date().toISOString()})}).catch(()=>{});
}
});
indice++;
}
/* ======= INÍCIO ======= */
telaInicial();
</script>
</body>
</html>
